<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OwnDesk</title>
  <script>
    if (new URLSearchParams(location.search).get("embedded") === "client") {
      document.documentElement.classList.add("embedded-client");
    }
  </script>
  <link rel="stylesheet" href="/app.css?v=20260428-webrtc-ice3">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="brand">OwnDesk</div>
        <div class="subtle">自用远程控制台</div>
      </div>
      <div class="status-pill" id="serverStatus">未登录</div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <section class="panel collapsible-panel organization-panel" data-section="organization">
          <button type="button" class="collapsible-header" data-toggle-section="organization">
            <span class="collapse-arrow">▾</span>
            <span>组织</span>
          </button>
          <div class="collapsible-body">
            <select class="organization-select" id="organizationSelect" aria-label="选择组织"></select>
            <div class="button-grid three">
              <button type="button" id="addOrganizationButton">新增</button>
              <button type="button" id="saveOrganizationButton">保存组织</button>
              <button type="button" class="danger" id="deleteOrganizationButton">删除</button>
            </div>
            <label>
              <span>组织名称</span>
              <input id="organizationNameInput" name="organizationName" placeholder="组织名称">
            </label>
            <label>
              <span>服务器 URL</span>
              <input id="serverUrlInput" name="serverUrl" placeholder="默认当前服务器">
            </label>
            <label>
              <span>组织 Token</span>
              <input id="organizationTokenInput" name="organizationToken" type="password" placeholder="组织 Token">
            </label>
          </div>
        </section>

        <section class="panel collapsible-panel member-panel" data-section="member">
          <button type="button" class="collapsible-header" data-toggle-section="member">
            <span class="collapse-arrow">▾</span>
            <span>成员</span>
          </button>
          <div class="collapsible-body">
            <form class="auth-panel" id="loginForm" autocomplete="off">
              <div class="auth-tabs" role="tablist" aria-label="认证模式">
                <button type="button" class="auth-tab active" id="loginModeButton" data-auth-mode="login">登录</button>
                <button type="button" class="auth-tab" id="registerModeButton" data-auth-mode="register">注册</button>
              </div>
              <label>
                <span>成员账号</span>
                <input id="accountInput" name="account" autocomplete="username" placeholder="成员账号" required>
              </label>
              <label>
                <span>密码</span>
                <input id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="成员密码" required>
              </label>
              <label id="confirmPasswordLabel" hidden>
                <span>确认密码</span>
                <input id="confirmPasswordInput" name="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入密码">
              </label>
              <button class="primary" id="authSubmitButton" type="submit">登录</button>
              <div class="auth-hint" id="authHint">登录后显示本组织的设备。</div>
            </form>
            <div class="member-info is-hidden" id="memberInfoPanel">
              <div id="memberIdentity"></div>
              <button type="button" class="danger" id="logoutButton">退出登录</button>
            </div>
          </div>
        </section>

        <section class="panel collapsible-panel device-panel" data-section="device">
          <div class="collapsible-header with-actions">
            <button type="button" class="section-toggle" data-toggle-section="device">
              <span class="collapse-arrow">▾</span>
              <span>设备</span>
            </button>
            <div class="button-row">
              <button type="button" class="icon-button" id="refreshButton" title="刷新设备">↻</button>
              <button type="button" class="icon-button" id="localDebugButton" title="本机调试模式" disabled>◎</button>
              <button type="button" class="icon-button" id="pointerLockButton" title="锁定鼠标" disabled>⌖</button>
              <button type="button" class="icon-button" id="disconnectButton" title="断开连接" disabled>×</button>
            </div>
          </div>
          <div class="collapsible-body">
            <div class="device-list" id="deviceList">
              <div class="empty-list">登录后显示设备</div>
            </div>
          </div>
        </section>
      </aside>

      <section class="workspace" id="workspace">
        <div class="screen-bar">
          <div>
            <div class="screen-title" id="activeDevice">未连接</div>
            <div class="subtle" id="frameStats">0 帧</div>
          </div>
          <div class="screen-actions">
            <button type="button" class="icon-button" id="fullscreenButton" title="全屏" disabled>⛶</button>
            <button type="button" class="icon-button" id="zoomOutButton" title="缩小" disabled>−</button>
            <button type="button" class="icon-button" id="fitButton" title="适配屏幕" disabled>⤢</button>
            <button type="button" class="icon-button" id="zoomInButton" title="放大" disabled>+</button>
            <button type="button" class="icon-button" id="panButton" title="拖动画面" disabled>↔</button>
            <button type="button" class="icon-button mobile-only-control" id="scrollButton" title="远端滚轮" disabled>⇅</button>
            <button type="button" class="icon-button mobile-only-control" id="keyboardButton" title="手机键盘" disabled>⌨</button>
            <select class="quality-select" id="qualitySelect" title="画质档位" disabled>
              <option value="smooth">流畅</option>
              <option value="balanced" selected>均衡</option>
              <option value="quality">清晰</option>
              <option value="ultra">超清</option>
            </select>
            <button type="button" class="icon-button" id="webrtcButton" title="WebRTC 视频" disabled>◉</button>
            <div class="status-pill offline" id="connectionStatus">离线</div>
          </div>
        </div>
        <button type="button" class="fullscreen-toolbar-toggle" id="toolbarToggleButton" title="显示工具栏" aria-label="显示工具栏">☰</button>

        <div class="screen-shell" id="screenShell">
          <div class="screen-content" id="screenContent">
            <canvas id="screenCanvas" tabindex="0"></canvas>
            <video id="webrtcVideo" autoplay playsinline muted></video>
            <div class="remote-cursor" id="remoteCursor"></div>
          </div>
          <div class="empty-screen" id="emptyScreen">选择一台在线设备发起连接</div>
        </div>

        <div class="keyboard-panel" id="keyboardPanel" hidden>
          <input
            id="keyboardInput"
            class="keyboard-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
            enterkeyhint="enter"
            placeholder="输入到远程设备"
            aria-label="Remote keyboard">
          <button type="button" class="mobile-only-control" data-pointer-click="right">右键</button>
          <button type="button" class="mobile-only-control" data-modifier-key-code="17" data-key="Control" aria-pressed="false">Ctrl</button>
          <button type="button" class="mobile-only-control" data-modifier-key-code="16" data-key="Shift" aria-pressed="false">Shift</button>
          <button type="button" class="mobile-only-control" data-modifier-key-code="18" data-key="Alt" aria-pressed="false">Alt</button>
          <button type="button" class="mobile-only-control" data-modifier-key-code="91" data-key="Meta" aria-pressed="false">Win</button>
          <button type="button" data-key-code="27" data-key="Escape">Esc</button>
          <button type="button" data-key-code="9" data-key="Tab">Tab</button>
          <button type="button" data-key-code="8" data-key="Backspace">⌫</button>
          <button type="button" data-key-code="13" data-key="Enter">↵</button>
          <button type="button" class="mobile-only-control" data-scroll="-480">滚上</button>
          <button type="button" class="mobile-only-control" data-scroll="480">滚下</button>
          <button type="button" data-key-code="37" data-key="ArrowLeft">←</button>
          <button type="button" data-key-code="38" data-key="ArrowUp">↑</button>
          <button type="button" data-key-code="40" data-key="ArrowDown">↓</button>
          <button type="button" data-key-code="39" data-key="ArrowRight">→</button>
        </div>
      </section>
    </main>
  </div>

  <script src="/app.js?v=20260428-webrtc-ice3"></script>
</body>
</html>
